# DAG / apply-progress state for the credential-admin-panel change.
# Survives compaction; updated by sdd-apply after each work unit.

change: credential-admin-panel
artifact_store: openspec
delivery_strategy: ask-on-risk
chain_strategy: feature-branch-chain
total_work_units: 5

apply_progress:
  - unit: 1
    phase: "Phase 1: Shared Crypto Primitives"
    pr: "PR 1"
    branch: feat/credential-admin-panel-01-crypto-csrf
    status: done
    tasks: [1.1, 1.2, 1.3, 1.4, 1.5, 1.6]
    commit: f89b816
    notes: >
      session.js exports sign()/timingSafeCompare(); src/csrf.js implements
      deriveCsrfSecret/issueCsrfToken/verifyCsrfToken/isAcceptableOrigin.
      33 tests in test/session.test.js + test/csrf.test.js, all green.

  - unit: 2
    phase: "Phase 2: Registry, Status Projection, GET /me/credentials"
    pr: "PR 2"
    branch: feat/credential-admin-panel-02-registry-status
    status: done
    tasks: [2.1, 2.2, 2.3, 2.4, 2.5, 2.6]
    commit: pending (left uncommitted for RDD review cycle)
    notes: >
      src/mcp-registry.js: frozen MCP_REGISTRY (atlassian/context7/engram) +
      getMcp(id); drift test regex-scans docker-compose.yml. Test-file only.
      src/credential-status.js: buildCredentialStatus(db,user,env) with
      explicit column SELECT (never SELECT *), R8-verified no ciphertext/
      plaintext/env-value leakage. src/app.js: new GET /me/credentials
      branch, authenticated via existing authenticate(), 401 when
      unauthenticated. 21 new tests across mcp-registry.test.js (8),
      credential-status.test.js (6), and enrollment.test.js (+2, total 7).
      Full auth-gateway suite: 100/100 passing.

  - unit: 3
    phase: "Phase 3: CSRF Enforcement + DELETE /me/atlassian"
    pr: "PR 3"
    branch: feat/credential-admin-panel-03-csrf-enforcement
    status: done
    tasks: [3.1, 3.2, 3.3, 3.4, 3.5]
    commit: pending (left uncommitted for RDD review cycle)
    notes: >
      src/verify.js: authenticateWithMethod(db,headers,secret) reports
      'bearer'|'cookie' (D2); authenticate() is now a thin wrapper over it —
      garbage Bearer + valid cookie correctly resolves to 'cookie' (R4).
      src/app.js: readBody() dual-parses JSON/x-www-form-urlencoded (64 KiB
      cap kept); shared authenticateCookieWrite() (steps 1-2: auth +
      strict-mode Origin check before body parsing) and
      verifyCookieWriteCsrf() (step 4: X-CSRF-Token header, else body 'csrf'
      field) extracted and reused by both handleEnrollAtlassian (existing
      POST /me/atlassian, now guarded) and the new handleDeleteAtlassian
      (DELETE /me/atlassian, created already-guarded per proposal.md — no
      unguarded intermediate state). DELETE handler is async and routed
      through runAsyncHandler so a synchronous DB throw becomes a rejected
      promise instead of crashing the process (mirrors Unit 2's
      handleCredentialStatus fix). 26 new tests: 5 in verify.test.js
      (authenticateWithMethod) + 17 in new csrf-enforcement.test.js. Fixed a
      pre-existing eslint gap (URLSearchParams missing from globals) needed
      by readBody(); ran prettier --write on src/app.js only (pre-existing
      credential-status.test.js formatting from Unit 2 left untouched — out
      of this unit's scope). Full auth-gateway suite: 117/117 passing,
      eslint clean, tsc baseline unchanged (21 pre-existing errors, all in
      test files, none introduced by this unit).

  - unit: 4
    phase: "Phase 4: Login Page"
    pr: "PR 4"
    branch: feat/credential-admin-panel-04-login-page
    status: done
    tasks: [4.1, 4.2, 4.3, 4.4]
    commit: pending (left uncommitted for RDD review cycle)
    notes: >
      src/html.js: escapeHtml (& < > " ' -> entities, null/undefined -> '',
      R6-verified <script>-bearing value renders inert), renderDocument
      (doctype/meta/shared inline <style> shell), PAGE_HEADERS (D4's exact
      CSP `default-src 'none'; style-src 'unsafe-inline'; form-action
      'self'; frame-ancestors 'none'; base-uri 'none'` + Cache-Control:
      no-store + X-Content-Type-Options: nosniff + Content-Type text/html).
      src/login-page.js: sanitizeNext (single-leading-slash only, rejects
      `//`, `/\`, and non-`/`-prefixed absolute URLs like `https://evil` ->
      default `/credentials`, R1) and renderLoginPage (zero-JS form,
      escapes username/next/error via escapeHtml, always calls sanitizeNext
      internally for defense-in-depth even if the caller already sanitized,
      password field is never pre-filled). src/app.js: added handleGetLogin
      (GET /login, unauthenticated, PAGE_HEADERS) and sendLoginFailure
      (401/400 html re-render with generic "Invalid username or password."
      message); handleLogin extended to check isAcceptableOrigin(strict:
      false) first (reject-on-mismatch, allow-on-absent, D5/R5), then
      readBody() (dual JSON/form, reused from Unit 3) instead of the
      now-dead readJsonBody (removed); response mode driven by isForm ->
      302 Location + fresh Set-Cookie on form success (verified no session
      fixation: a client-supplied pre-existing cookie is ignored, the fresh
      token is bound to the authenticated uid), JSON 200 unchanged on JSON
      success. GET /login wired before POST /login in the dispatcher; both
      new handlers are synchronous (no DB write, no async gap) so no
      runAsyncHandler wrapping was needed for them specifically -- handleLogin
      itself is unchanged from before as an async function already routed
      through runAsyncHandler. 14 new tests: 4 in html.test.js + 10 in
      login.test.js (6 original + 10 new = 16 total in that file). Full
      auth-gateway suite: 131/131 passing, eslint clean, prettier clean
      for all touched files (pre-existing credential-status.test.js
      formatting issue from Unit 2 left untouched, same as Unit 3), tsc
      baseline 21 -> 23 (+2, both TS18046 'unknown' from unannotated
      res.json() in the two new Origin-check tests in login.test.js --
      identical pre-existing unaddressed pattern already present in
      csrf-enforcement.test.js/enrollment.test.js/credential-status.test.js/
      mcp-registry.test.js, no new error *class* introduced).

  - unit: 5
    phase: "Phase 5: Credentials Panel, Route Wiring, Docs"
    pr: "PR 5"
    branch: feat/credential-admin-panel-05-panel
    status: done
    tasks: [5.1, 5.2, 5.3, 5.4, 5.5, 5.6, 5.7]
    commit: pending (left uncommitted for RDD review cycle)
    notes: >
      src/panel.js: renderPanel({status, csrfToken, errorCode}) + frozen
      PANEL_ERRORS allow-list ({invalid, csrf}); per-user MCP rows render
      enroll + (when enrolled) delete forms, both carrying the same
      per-caller CSRF token; shared MCP rows render read-only (no <form>),
      the shared secret's env var *name* looked up via getMcp() purely for
      display, never its value. Every interpolation goes through
      escapeHtml (R6). Unrecognized ?error= renders no banner (R7).
      src/app.js: new GET /credentials (handleCredentialsPanel) —
      authenticate() + wantsHtml(Accept) decides 302 /login?next=%2Fcredentials
      vs 401 JSON when unauthenticated; buildCredentialStatus() wrapped in
      try/catch -> 500 on DB failure (mirrors handleCredentialStatus);
      issueCsrfToken(user.id, ...) per render. New POST /me/atlassian/delete
      (handleDeleteAtlassianForm, async, runAsyncHandler) — the no-JS
      panel's form-reachable equivalent of Unit 3's DELETE /me/atlassian,
      same 5-step cookie-write guard reused end-to-end (authenticateCookieWrite
      + verifyCookieWriteCsrf), 302 /credentials on success. Made
      verifyCookieWriteCsrf isForm-aware: on CSRF failure a form request now
      redirects 302 /credentials?error=csrf instead of JSON 403 (existing
      DELETE /me/atlassian and non-form callers keep the JSON 403 — isForm
      defaults false, so no prior behavior changed). handleEnrollAtlassian
      (POST /me/atlassian) is now response-mode-aware end to end: isForm ->
      302 /credentials on success, 302 /credentials?error=invalid on field
      validation failure (design.md's accepted open-question tradeoff — the
      token field is never re-echoed anyway), JSON 200/400 unchanged for
      every existing non-form caller. src/verify.js: enrollUrl repointed
      from https://auth.{domain}/me/atlassian to
      https://auth.{domain}/credentials. README.md: new paragraph under
      "Logging in" documenting /credentials (per-MCP forms vs read-only
      shared rows, enrollUrl redirect, /login?next= redirect-when-logged-out,
      CSRF scope). 16 new tests: 15 in new test/panel.test.js + 1 extended
      in test/verify.test.js (enrollUrl); full auth-gateway suite: 148/148
      passing (was 132 baseline before this unit), eslint clean, prettier
      clean for every file touched by this unit (pre-existing
      credential-status.test.js formatting drift from Unit 2 left
      untouched, same precedent as Units 3-4), tsc baseline 23 -> 25 (+2,
      both TS18046 'unknown' from unannotated res.json() in the two new
      tests in panel.test.js/verify.test.js -- identical pre-existing
      unaddressed pattern already present in 5 other test files, no new
      error *class* introduced). Focused command from tasks.md
      (`node --test test/panel.test.js test/verify.test.js`): 38/38
      passing. This is the final unit (5 of 5) of credential-admin-panel;
      all Review Workload Forecast work units are now done.

deferred_notes:
  - "None blocking. Unit 3 needs authenticateWithMethod() (D2) from verify.js
    before the CSRF guard can distinguish bearer vs cookie auth on writes —
    not required for Unit 2's read-only GET /me/credentials, which reuses
    the existing authenticate() wrapper unchanged."
