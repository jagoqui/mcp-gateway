# openspec/config.yaml
schema: spec-driven

context: |
  Project: mcp-gateway (Docker Compose infra for MCP servers).
  Stack: Dockerfile (shared base runtime), docker-compose.yml, Caddyfile
    (reverse proxy + auth gate), plus one real app service: auth-gateway
    (Node.js/Express + SQLite, login/token issuance).
  Architecture: infra-as-code (Docker/Compose/Caddy) hosting several
    MCP servers behind a reverse-proxy auth gate; auth-gateway is the
    only unit-testable application code.
  Testing: auth-gateway warrants strict TDD with `node --test` (built into
    Node 22, zero runtime deps). Dockerfile, docker-compose.yml, Caddyfile,
    and shell scripts are infra/config, not unit-testable in the
    traditional TDD sense.
  Repo state: git repo on chained feature branches
    (feat/gateway-foundation-01..03). RDD (gentle-ai review mode) is
    user-opt-in and off by default.

strict_tdd: true

testing:
  scope: "auth-gateway only; infra/config artifacts are excluded from TDD"
  runner: "node --test"
  layers:
    unit: "done — token hash/compare, AES-GCM round-trip, bcrypt verify, db schema (test/{crypto,tokens,db}.test.js)"
    integration: "done — listen(0) + fetch against a temp SQLite db (test/{verify,login,enrollment,admin}.test.js)"
    e2e: "not planned (manual apply-gate smoke script covers Phase 4 instead, see tasks.md 5.x)"
  coverage:
    available: false
    command: ""
  quality_tools:
    linter: "eslint"
    type_checker: "plain JS + JSDoc, checked via tsc --noEmit"
    formatter: "prettier"
  non_testable_artifacts:
    - Dockerfile
    - docker-compose.yml
    - Caddyfile
    - shell scripts

rules:
  proposal:
    - Include rollback plan for risky changes
    - Call out which parts of a change are infra/config (no TDD) vs. app code (strict TDD)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - auth-gateway specs MUST define testable scenarios; infra specs describe desired state/behavior, not unit tests
  design:
    - Include sequence diagrams for complex flows (e.g. login/token issuance through Caddy to auth-gateway)
    - Document architecture decisions with rationale (e.g. shared base image strategy, Caddy auth gate placement)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Separate infra/config tasks (Dockerfile, compose, Caddyfile) from strict-TDD auth-gateway tasks
  apply:
    guidelines:
      - Follow existing code patterns once auth-gateway scaffolding exists
      - RED-GREEN-REFACTOR applies only to auth-gateway application code
    tdd: true
    test_command: "npm --prefix services/auth-gateway test"
  verify:
    test_command: "npm --prefix services/auth-gateway test"
    build_command: "docker compose config -q"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

notes:
  - "git init has run; the repo is on feature branches (feat/gateway-foundation-*) chained via feature-branch-chain PRs. RDD (gentle-ai review mode) remains user-opt-in, unrelated to git init status."
  - "services/auth-gateway is a fully built and tested Express app (PR2a/PR2b). services/engram-monitor has a Dockerfile/nginx.conf (PR3); its src/ is a gitignored manual clone of github.com/egdev6/engram-monitor, not committed to this repo."
