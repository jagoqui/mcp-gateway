# Minimal SPA-fallback config for the engram-monitor static build.
# All client-side routes fall back to index.html; the app's router takes it
# from there. No API proxying here — the backend URL is baked into the JS
# bundle at build time via VITE_ENGRAM_URL (see ../Dockerfile).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
