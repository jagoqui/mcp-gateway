# SPA-fallback config for the engram-monitor static build, plus an internal
# API proxy. VITE_ENGRAM_URL is baked into the JS bundle as the relative
# path /api (see ../Dockerfile), so the browser's axios calls stay same-origin
# with this page — the host's real `engram serve` (no CORS headers of its
# own) would otherwise be blocked by the browser as a cross-origin response,
# even over a working SSH tunnel to two separate ports.
#
# Listens on 7438, not 80: this container runs with network_mode: host (see
# docker-compose.yml) because the host's engram serve is bound to
# 127.0.0.1 only (not 0.0.0.0), so no bridge-networked container can reach
# it via host.docker.internal — only sharing the host's own network
# namespace can. Port 80 stays free for Caddy, which also runs on the host
# network stack via its own port publish.

server {
    # Explicit 127.0.0.1, not bare 7438: with network_mode: host (see
    # docker-compose.yml) this process shares every interface of the host,
    # so an unqualified `listen 7438` would bind 0.0.0.0 and publish this
    # unauthenticated dashboard on the VPS's public interface too. Binding
    # loopback only preserves the SSH-tunnel-only access this repo relies
    # on for security here.
    listen 127.0.0.1:7438;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:7437/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
