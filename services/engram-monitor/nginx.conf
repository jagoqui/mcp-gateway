# SPA-fallback config for the engram-monitor static build, plus two internal
# API proxies. Consolidated onto engram-cloud.{$DOMAIN}'s own domain under
# the /monitor/ subpath (single-domain, single-login per user request) —
# VITE_BASE_PATH=/monitor/ (see ../Dockerfile) bakes that same prefix into
# every asset reference the build emits, so every location below carries
# it too: a stray unprefixed location would silently 404 the moment a
# browser actually resolves one of those baked-in absolute paths.
#
# Listens on 80, on the `gateway` bridge network (see docker-compose.yml).
# /monitor/api/* targets engram-serve:7437, the engram-serve-bridge
# wrapper's Docker DNS name, since a bare `engram serve` binds 127.0.0.1
# only and is otherwise unreachable from any other container. Public
# access is gated upstream at Caddy's engram-cloud.{$DOMAIN} block
# (forward_auth against auth-gateway's /admin/verify), not here.

server {
    listen 80;
    server_name _;

    # nginx only ever sees plain HTTP from Caddy (TLS is terminated there,
    # not forwarded as X-Forwarded-Proto) — without this, `return 301`
    # below guesses $scheme=http and emits a Location that bounces through
    # an extra unnecessary HTTP->HTTPS hop at Caddy.
    absolute_redirect off;

    location /monitor/api/ {
        proxy_pass http://engram-serve:7437/;
        proxy_set_header Host $host;
    }

    # Engram Cloud admin proxy routes (list/create users, grant projects,
    # issue tokens) — served by auth-gateway, never called with a token the
    # browser itself holds. See openspec/changes/engram-unified-console.
    location /monitor/admin/ {
        proxy_pass http://auth-gateway:3000/admin/;
        proxy_set_header Host $host;
    }

    location /monitor/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /monitor/index.html;
    }

    # Bare /monitor (no trailing slash) wouldn't match the prefix location
    # above — Vite's base=/monitor/ assumes the slash is always present.
    location = /monitor {
        return 301 /monitor/;
    }
}
