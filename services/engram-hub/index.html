<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>engram hub</title>
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;padding:2rem 1rem;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:24rem;margin:3rem auto}
h1{font-size:1.5rem;margin:0 0 .25rem}
.sub{margin:0 0 2rem;opacity:.7;font-size:.95rem}
label{display:block;margin:0 0 .75rem;font-size:.9rem}
input{display:block;width:100%;margin-top:.25rem;padding:.5rem;font:inherit;border:1px solid currentColor;border-radius:4px;background:transparent;color:inherit}
button,.link-btn{font:inherit;padding:.5rem 1rem;border-radius:4px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;display:block;width:100%;margin-top:.75rem;text-align:center;text-decoration:none}
button:first-of-type{margin-top:0}
.error{border:1px solid currentColor;padding:.5rem .75rem;border-radius:4px;margin:0 0 1rem;font-size:.9rem}
.error[hidden]{display:none}
.links[hidden]{display:none}
.note{margin:1.5rem 0 0;font-size:.85rem;opacity:.7}
</style>
</head>
<body>
<main>
  <h1>engram hub</h1>
  <p class="sub">Enter the shared token to open your dashboards.</p>

  <p class="error" id="error" hidden></p>

  <form id="login-form">
    <label>
      Token
      <input type="password" id="token" name="token" required autofocus autocomplete="off">
    </label>
    <button type="submit">Entrar</button>
  </form>

  <div class="links" id="links" hidden>
    <button type="button" id="open-cloud">Abrir Engram Cloud</button>
    <a class="link-btn" id="open-monitor" href="#" target="_blank" rel="noopener">Abrir Engram Monitor</a>
  </div>

  <p class="note">This token also unlocks Engram Monitor via a shared cookie for this domain.</p>
</main>

<form id="cloud-login-form" method="post" target="_blank" hidden>
  <input type="hidden" name="token" id="cloud-login-token">
</form>

<script>
// Hardcoded on purpose: this is a static file served by Caddy's file_server
// (see the Caddyfile's engram-hub block), so there is no server-side
// templating step available to inject it.
const DOMAIN = "jagoqui.tech";

const tokenInput = document.getElementById("token");
const loginForm = document.getElementById("login-form");
const errorEl = document.getElementById("error");
const linksEl = document.getElementById("links");
const cloudLoginForm = document.getElementById("cloud-login-form");
const cloudLoginToken = document.getElementById("cloud-login-token");
const openCloudBtn = document.getElementById("open-cloud");
const openMonitorLink = document.getElementById("open-monitor");

cloudLoginForm.action = "https://engram-cloud." + DOMAIN + "/dashboard/login";
openMonitorLink.href = "https://engram-monitor." + DOMAIN + "/";

loginForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  errorEl.hidden = true;
  linksEl.hidden = true;

  const token = tokenInput.value;

  let response;
  try {
    response = await fetch("/engram-verify", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "token=" + encodeURIComponent(token),
      credentials: "include",
    });
  } catch {
    errorEl.textContent = "Network error. Try again.";
    errorEl.hidden = false;
    return;
  }

  if (response.status === 204) {
    // Kept only in memory for the "Abrir Engram Cloud" top-level form POST
    // below — never persisted (no localStorage/sessionStorage), and never
    // sent anywhere else.
    cloudLoginToken.value = token;
    linksEl.hidden = false;
    return;
  }

  errorEl.textContent = "Token inválido";
  errorEl.hidden = false;
});

openCloudBtn.addEventListener("click", () => {
  // Real top-level form submission (not fetch/XHR) — engram-cloud's own
  // /dashboard/login sets its own session cookie on the response, which
  // only sticks for a real navigation, not a cross-origin fetch.
  cloudLoginForm.submit();
});
</script>
</body>
</html>
