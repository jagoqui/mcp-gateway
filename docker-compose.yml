name: mcp-gateway

# caddy, auth-gateway, the three pilot MCP services (PR1/PR2), plus
# engram-cloud, engram-cloud-db, and engram-monitor (PR3 — see
# openspec/changes/gateway-foundation/tasks.md, Phase 3).

x-mcp-image: &mcp-image
  build:
    context: .
    dockerfile: Dockerfile
    args:
      ENGRAM_VERSION: ${ENGRAM_VERSION:-}
  restart: unless-stopped
  networks:
    - gateway

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-jagoqui.tech}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - gateway
    depends_on:
      - auth-gateway
      - mcp-context7
      - mcp-atlassian
      - mcp-engram-tool
      - engram-cloud
      - engram-monitor

  auth-gateway:
    build:
      context: ./services/auth-gateway
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-jagoqui.tech}
      ATLASSIAN_ENC_KEY: ${ATLASSIAN_ENC_KEY}
      AUTH_GATEWAY_SESSION_SECRET: ${AUTH_GATEWAY_SESSION_SECRET}
    volumes:
      - auth_gateway_data:/data
    networks:
      - gateway
    expose:
      - "3000"

  mcp-context7:
    <<: *mcp-image
    command:
      [
        "supergateway",
        "--stdio", "context7-mcp",
        "--outputTransport", "streamableHttp",
        "--port", "9000",
        "--host", "0.0.0.0"
      ]
    environment:
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY}
    expose:
      - "9000"

  mcp-atlassian:
    <<: *mcp-image
    command:
      [
        "mcp-atlassian",
        "--transport", "streamable-http",
        "--port", "9000",
        "--host", "0.0.0.0"
      ]
    environment:
      ATLASSIAN_URL: ${ATLASSIAN_URL}
      ATLASSIAN_OAUTH_ENABLE: "true"
    expose:
      - "9000"

  mcp-engram-tool:
    <<: *mcp-image
    command:
      [
        "supergateway",
        "--stdio", "engram mcp",
        "--outputTransport", "streamableHttp",
        "--port", "9000",
        "--host", "0.0.0.0"
      ]
    environment:
      ENGRAM_API_KEY: ${ENGRAM_API_KEY}
    expose:
      - "9000"

  engram-cloud-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ENGRAM_CLOUD_DB_USER}
      POSTGRES_PASSWORD: ${ENGRAM_CLOUD_DB_PASSWORD}
      POSTGRES_DB: ${ENGRAM_CLOUD_DB_NAME}
    volumes:
      - engram_cloud_db_data:/var/lib/postgresql/data
    networks:
      - gateway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ENGRAM_CLOUD_DB_USER} -d ${ENGRAM_CLOUD_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs `engram cloud serve` — a DIFFERENT mode from the plain `engram serve`
  # local API that engram-monitor (below) was built against. See
  # services/engram-monitor/Dockerfile and README.md for the compatibility
  # caveat. NEVER set ENGRAM_CLOUD_INSECURE_NO_AUTH here (local-dev-only,
  # disables auth entirely) — not even as a commented example.
  engram-cloud:
    image: ghcr.io/gentleman-programming/engram:latest
    restart: unless-stopped
    environment:
      ENGRAM_DATABASE_URL: postgres://${ENGRAM_CLOUD_DB_USER}:${ENGRAM_CLOUD_DB_PASSWORD}@engram-cloud-db:5432/${ENGRAM_CLOUD_DB_NAME}
      ENGRAM_CLOUD_TOKEN: ${ENGRAM_CLOUD_TOKEN}
      ENGRAM_CLOUD_ADMIN: ${ENGRAM_CLOUD_ADMIN}
      ENGRAM_JWT_SECRET: ${ENGRAM_JWT_SECRET}
      ENGRAM_CLOUD_ALLOWED_PROJECTS: ${ENGRAM_CLOUD_ALLOWED_PROJECTS}
      ENGRAM_CLOUD_HOST: 0.0.0.0
      ENGRAM_PORT: "18080"
    depends_on:
      engram-cloud-db:
        condition: service_healthy
    networks:
      - gateway
    expose:
      - "18080"

  # UNVERIFIED compatibility: this dashboard was built for a plain
  # `engram serve` local API, not `engram cloud serve` (see Dockerfile).
  # Smoke-test in Phase 4 before relying on it.
  engram-monitor:
    build:
      context: ./services/engram-monitor
      args:
        VITE_ENGRAM_URL: ${VITE_ENGRAM_URL:-http://engram-cloud:18080}
    restart: unless-stopped
    depends_on:
      - engram-cloud
    networks:
      - gateway
    expose:
      - "80"

networks:
  gateway:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  auth_gateway_data:
  engram_cloud_db_data:
