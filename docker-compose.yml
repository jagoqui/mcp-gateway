name: mcp-gateway

# caddy, auth-gateway, the three pilot MCP services (PR1/PR2), plus
# engram-cloud, engram-cloud-db, and engram-monitor (PR3 — see
# openspec/changes/gateway-foundation/tasks.md, Phase 3).

x-mcp-image: &mcp-image
  build:
    context: .
    dockerfile: Dockerfile
    args:
      ENGRAM_VERSION: ${ENGRAM_VERSION:-}
  restart: unless-stopped
  networks:
    - gateway

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-jagoqui.tech}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - gateway
    depends_on:
      - auth-gateway
      - mcp-context7
      - mcp-atlassian
      - engram-router
      - engram-cloud
      - engram-monitor

  auth-gateway:
    build:
      context: ./services/auth-gateway
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-jagoqui.tech}
      ATLASSIAN_ENC_KEY: ${ATLASSIAN_ENC_KEY}
      AUTH_GATEWAY_SESSION_SECRET: ${AUTH_GATEWAY_SESSION_SECRET}
      AUTH_GATEWAY_ADMIN_SESSION_SECRET: ${AUTH_GATEWAY_ADMIN_SESSION_SECRET}
      # A genuine MANAGED admin token (PrincipalSourceManagedToken), issued
      # via `engram cloud bootstrap admin --issue-token` /
      # `bootstrap recover-token` against the live engram-cloud instance —
      # NOT the same value as engram-cloud's own ENGRAM_CLOUD_ADMIN below.
      # Confirmed via deepwiki against engram's own source
      # (requireManagedAdmin): every /admin/* route explicitly REJECTS the
      # legacy ENGRAM_CLOUD_TOKEN/ENGRAM_CLOUD_ADMIN env-var fallback
      # tokens (PrincipalSourceLegacyEnvAdmin) with 403 — a first, wrong
      # assumption this comment used to make. Also requires
      # ENGRAM_CLOUD_TOKEN_PEPPER to be set on engram-cloud itself, or
      # managed-token auth is disabled entirely server-side. See
      # services/auth-gateway/src/engram-cloud-client.js and
      # openspec/changes/engram-unified-console/design.md's
      # "Post-Implementation Correction".
      ENGRAM_CLOUD_ADMIN_TOKEN: ${ENGRAM_CLOUD_ADMIN_TOKEN}
      ENGRAM_CLOUD_SERVER: http://engram-cloud:18080
      # Shared secret gating GET /internal/engram-grant — a
      # service-to-service-only route (never routed through Caddy)
      # engram-router calls on its cold spawn path to check whether a
      # requested SHARED (non-identity-private) Engram project is
      # actually grant-authorized for the caller. See
      # odd/tasks/engram-shared-projects.md.
      ENGRAM_ROUTER_INTERNAL_SECRET: ${ENGRAM_ROUTER_INTERNAL_SECRET}
    volumes:
      - auth_gateway_data:/data
    networks:
      - gateway
    expose:
      - "3000"

  mcp-context7:
    <<: *mcp-image
    command:
      [
        "supergateway",
        "--stdio", "context7-mcp",
        "--outputTransport", "streamableHttp",
        "--port", "9000",
        "--host", "0.0.0.0",
        # Caddy's `handle /mcp/context7*` forwards the full incoming path
        # (no strip), so this backend must serve exactly that path, not
        # its /mcp default — same reasoning for mcp-atlassian's --path and
        # mcp-engram-tool's --streamableHttpPath below.
        "--streamableHttpPath", "/mcp/context7"
      ]
    environment:
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY}
    expose:
      - "9000"

  mcp-atlassian:
    <<: *mcp-image
    command:
      [
        "mcp-atlassian",
        "--transport", "streamable-http",
        "--port", "9000",
        "--host", "0.0.0.0",
        "--path", "/mcp/atlassian"
      ]
    environment:
      ATLASSIAN_URL: ${ATLASSIAN_URL}
      ATLASSIAN_OAUTH_ENABLE: "true"
      # Explicit: mcp-atlassian's own default toolset scope changed in a
      # recent release, so an unset TOOLSETS now warns and depends on
      # whichever default that release ships. Pin to "all" to keep every
      # Jira/Confluence tool available regardless of upstream defaults.
      TOOLSETS: "all"
    expose:
      - "9000"

  # Per-identity Streamable HTTP MCP router — replaces the old single-project
  # mcp-engram-tool (retired). One supergateway-wrapped `engram mcp` child is
  # spawned per authenticated gateway identity, each with its own
  # ENGRAM_PROJECT and cloud autosync scoped to the engram-cloud service
  # below. See openspec/changes/engram-remote-mcp/design.md.
  engram-router:
    build:
      context: ./services/engram-router
      args:
        ENGRAM_VERSION: ${ENGRAM_VERSION:-}
    restart: unless-stopped
    environment:
      PORT: "9000"
      # Legacy wildcard token (ENGRAM_CLOUD_ALLOWED_PROJECTS=*), not a
      # managed principal token — deliberate, see design.md's Approach:
      # only the legacy model accepts sync for a project it has never seen
      # before, which per-identity auto-provisioning depends on.
      ENGRAM_CLOUD_TOKEN: ${ENGRAM_CLOUD_TOKEN}
      ENGRAM_CLOUD_SERVER: http://engram-cloud:18080
      MAX_ENGRAM_CHILDREN: ${MAX_ENGRAM_CHILDREN:-20}
      ENGRAM_ROUTER_PORT_BASE: "19100"
      # Same shared secret as auth-gateway's own copy above — lets this
      # service call GET /internal/engram-grant on its cold spawn path,
      # to grant-check a requested shared (non-identity-private)
      # project before enrolling/spawning a child for it. See
      # odd/tasks/engram-shared-projects.md.
      ENGRAM_ROUTER_INTERNAL_SECRET: ${ENGRAM_ROUTER_INTERNAL_SECRET}
      AUTH_GATEWAY_INTERNAL_URL: http://auth-gateway:3000
    networks:
      - gateway
    depends_on:
      - engram-cloud
      - auth-gateway
    expose:
      - "9000"
    volumes:
      # engram defaults to ~/.engram/engram.db for its LOCAL SQLite store —
      # one file shared by every spawned identity's child (rows scoped by
      # the `project` column), and critically the home of
      # `sync_enrolled_projects`, the one-time enrollment state
      # `engram cloud enroll` writes (process-manager.js's enrollProject).
      # Without this volume, a plain image rebuild wipes every project's
      # enrollment AND its not-yet-synced local memory, silently.
      - engram_router_data:/home/app/.engram

  # Multi-project `engram serve` reverse-proxy wrapper — engram-monitor's
  # backend. `engram serve` only ever binds 127.0.0.1, no CLI flag or env
  # var to change that (confirmed against source), so this small wrapper
  # spawns it internally and re-exposes it on the gateway network under the
  # DNS name every other service in this stack already expects:
  # `engram-serve:7437`. See openspec/changes/engram-unified-console/design.md.
  engram-serve:
    build:
      context: ./services/engram-serve-bridge
      args:
        ENGRAM_VERSION: ${ENGRAM_VERSION:-}
    restart: unless-stopped
    environment:
      PORT: "7437"
      ENGRAM_SERVE_PORT: "17437"
      # Same legacy wildcard token engram-router uses — see design.md.
      ENGRAM_CLOUD_TOKEN: ${ENGRAM_CLOUD_TOKEN}
      ENGRAM_CLOUD_SERVER: http://engram-cloud:18080
    networks:
      - gateway
    depends_on:
      - engram-cloud
    expose:
      - "7437"
    volumes:
      # Same reasoning as engram_router_data — engram serve's own local
      # SQLite store (sync_enrolled_projects + any not-yet-synced memory)
      # must survive a plain image rebuild.
      - engram_serve_data:/home/app/.engram

  engram-cloud-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ENGRAM_CLOUD_DB_USER}
      POSTGRES_PASSWORD: ${ENGRAM_CLOUD_DB_PASSWORD}
      POSTGRES_DB: ${ENGRAM_CLOUD_DB_NAME}
    volumes:
      - engram_cloud_db_data:/var/lib/postgresql/data
    networks:
      - gateway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ENGRAM_CLOUD_DB_USER} -d ${ENGRAM_CLOUD_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs `engram cloud serve` (Postgres-backed team sync, its own built-in
  # dashboard at /dashboard/*) — a DIFFERENT surface from the plain
  # `engram serve` API engram-monitor (below) is wired to instead. Not
  # routed through Caddy — reached only internally, by engram-router's
  # per-identity children pushing autosync writes here (see
  # openspec/changes/engram-remote-mcp). ENGRAM_CLOUD_ALLOWED_PROJECTS
  # MUST stay "*" for that to work: engram-router's whole point is
  # onboarding a never-before-seen project with zero admin action, which
  # only the legacy wildcard model supports (managed tokens are
  # deny-by-default with no wildcard).
  # NEVER set ENGRAM_CLOUD_INSECURE_NO_AUTH here (local-dev-only, disables
  # auth entirely) — not even as a commented example.
  engram-cloud:
    image: ghcr.io/gentleman-programming/engram:latest
    restart: unless-stopped
    environment:
      ENGRAM_DATABASE_URL: postgres://${ENGRAM_CLOUD_DB_USER}:${ENGRAM_CLOUD_DB_PASSWORD}@engram-cloud-db:5432/${ENGRAM_CLOUD_DB_NAME}
      ENGRAM_CLOUD_TOKEN: ${ENGRAM_CLOUD_TOKEN}
      ENGRAM_CLOUD_ADMIN: ${ENGRAM_CLOUD_ADMIN}
      # Without this, managed-token auth (PrincipalSourceManagedToken) is
      # disabled entirely and the server falls back to legacy
      # ENGRAM_CLOUD_TOKEN/ENGRAM_CLOUD_ADMIN credentials only — which
      # requireManagedAdmin explicitly forbids on every /admin/* route
      # (confirmed via deepwiki against engram's own source, engram-unified-
      # console Phase 3). Distinct secret from ENGRAM_JWT_SECRET below.
      ENGRAM_CLOUD_TOKEN_PEPPER: ${ENGRAM_CLOUD_TOKEN_PEPPER}
      ENGRAM_JWT_SECRET: ${ENGRAM_JWT_SECRET}
      ENGRAM_CLOUD_ALLOWED_PROJECTS: ${ENGRAM_CLOUD_ALLOWED_PROJECTS}
      ENGRAM_CLOUD_HOST: 0.0.0.0
      ENGRAM_PORT: "18080"
    depends_on:
      engram-cloud-db:
        condition: service_healthy
    networks:
      - gateway
    # Loopback-only, for the operator to inspect this instance's dashboard
    # via SSH tunnel — same pattern as ~/.engram's own "cloud" service (a
    # SEPARATE, unrelated instance/database also on 18080, so tunnel one at
    # a time or map this one to a different local port). Never bound wider
    # than 127.0.0.1: no auth-gateway forward_auth in front of this port,
    # only engram-cloud's own token check.
    ports:
      - "127.0.0.1:18081:18080"
    expose:
      - "18080"

  # Routed through Caddy's `monitor.{$DOMAIN}` block, gated by the same
  # admin session as Engram Cloud's own dashboard (forward_auth against
  # auth-gateway's /admin/verify — see Caddyfile). nginx.conf proxies
  # /api/* to engram-serve:7437 (Docker DNS, no more loopback/host-network
  # dependency) and /admin/* to auth-gateway:3000, keeping the browser
  # same-origin. See openspec/changes/engram-unified-console/design.md's
  # "engram-monitor leaves network_mode: host" decision — the only reason
  # it needed the host's network namespace was to reach the bare host's
  # loopback-only engram serve, a constraint the engram-serve-bridge
  # service above removes.
  engram-monitor:
    build:
      context: ./services/engram-monitor
      args:
        # Consolidated onto engram-cloud.{$DOMAIN}'s own /monitor/ subpath
        # (single-domain, single-login) — both must agree with nginx.conf's
        # /monitor/ locations and the Caddyfile's `handle /monitor*` block.
        VITE_BASE_PATH: /monitor/
        VITE_ENGRAM_URL: ${VITE_ENGRAM_URL:-/monitor/api}
    restart: unless-stopped
    networks:
      - gateway
    depends_on:
      - engram-serve
    expose:
      - "80"

networks:
  gateway:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  auth_gateway_data:
  engram_cloud_db_data:
  engram_router_data:
  engram_serve_data:
