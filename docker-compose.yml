name: mcp-gateway

# caddy, auth-gateway, the three pilot MCP services (PR1/PR2), plus
# engram-cloud, engram-cloud-db, and engram-monitor (PR3 — see
# openspec/changes/gateway-foundation/tasks.md, Phase 3).

x-mcp-image: &mcp-image
  build:
    context: .
    dockerfile: Dockerfile
    args:
      ENGRAM_VERSION: ${ENGRAM_VERSION:-}
  restart: unless-stopped
  networks:
    - gateway

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-jagoqui.tech}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - gateway
    depends_on:
      - auth-gateway
      - mcp-context7
      - mcp-atlassian
      - mcp-engram-tool
      - engram-cloud

  auth-gateway:
    build:
      context: ./services/auth-gateway
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-jagoqui.tech}
      ATLASSIAN_ENC_KEY: ${ATLASSIAN_ENC_KEY}
      AUTH_GATEWAY_SESSION_SECRET: ${AUTH_GATEWAY_SESSION_SECRET}
    volumes:
      - auth_gateway_data:/data
    networks:
      - gateway
    expose:
      - "3000"

  mcp-context7:
    <<: *mcp-image
    command:
      [
        "supergateway",
        "--stdio", "context7-mcp",
        "--outputTransport", "streamableHttp",
        "--port", "9000",
        "--host", "0.0.0.0"
      ]
    environment:
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY}
    expose:
      - "9000"

  mcp-atlassian:
    <<: *mcp-image
    command:
      [
        "mcp-atlassian",
        "--transport", "streamable-http",
        "--port", "9000",
        "--host", "0.0.0.0"
      ]
    environment:
      ATLASSIAN_URL: ${ATLASSIAN_URL}
      ATLASSIAN_OAUTH_ENABLE: "true"
    expose:
      - "9000"

  mcp-engram-tool:
    <<: *mcp-image
    command:
      [
        "supergateway",
        "--stdio", "engram mcp",
        "--outputTransport", "streamableHttp",
        "--port", "9000",
        "--host", "0.0.0.0"
      ]
    environment:
      ENGRAM_API_KEY: ${ENGRAM_API_KEY}
    expose:
      - "9000"

  engram-cloud-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ENGRAM_CLOUD_DB_USER}
      POSTGRES_PASSWORD: ${ENGRAM_CLOUD_DB_PASSWORD}
      POSTGRES_DB: ${ENGRAM_CLOUD_DB_NAME}
    volumes:
      - engram_cloud_db_data:/var/lib/postgresql/data
    networks:
      - gateway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ENGRAM_CLOUD_DB_USER} -d ${ENGRAM_CLOUD_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs `engram cloud serve` (Postgres-backed team sync, its own built-in
  # dashboard at /dashboard/*) — a DIFFERENT surface from the plain
  # `engram serve` API engram-monitor (below) is wired to instead. Not
  # routed through Caddy yet; runs internally for future team-sync use.
  # NEVER set ENGRAM_CLOUD_INSECURE_NO_AUTH here (local-dev-only, disables
  # auth entirely) — not even as a commented example.
  engram-cloud:
    image: ghcr.io/gentleman-programming/engram:latest
    restart: unless-stopped
    environment:
      ENGRAM_DATABASE_URL: postgres://${ENGRAM_CLOUD_DB_USER}:${ENGRAM_CLOUD_DB_PASSWORD}@engram-cloud-db:5432/${ENGRAM_CLOUD_DB_NAME}
      ENGRAM_CLOUD_TOKEN: ${ENGRAM_CLOUD_TOKEN}
      ENGRAM_CLOUD_ADMIN: ${ENGRAM_CLOUD_ADMIN}
      ENGRAM_JWT_SECRET: ${ENGRAM_JWT_SECRET}
      ENGRAM_CLOUD_ALLOWED_PROJECTS: ${ENGRAM_CLOUD_ALLOWED_PROJECTS}
      ENGRAM_CLOUD_HOST: 0.0.0.0
      ENGRAM_PORT: "18080"
    depends_on:
      engram-cloud-db:
        condition: service_healthy
    networks:
      - gateway
    expose:
      - "18080"

  # Deliberately NOT routed through Caddy or published publicly — see
  # Caddyfile's comment and README.md's "engram-monitor backend" section
  # (its client sends no auth credentials, so it can't sit behind
  # forward_auth without breaking, and the underlying engram serve API has
  # no auth of its own to expose publicly instead). Published on the VPS's
  # own loopback only; reach it via an SSH tunnel of this port together
  # with 7437 (engram serve itself, which the bundled JS calls at build-time
  # baked-in http://127.0.0.1:7437 — see services/engram-monitor/Dockerfile).
  engram-monitor:
    build:
      context: ./services/engram-monitor
      args:
        VITE_ENGRAM_URL: ${VITE_ENGRAM_URL:-http://127.0.0.1:7437}
    restart: unless-stopped
    networks:
      - gateway
    ports:
      - "127.0.0.1:7438:80"

networks:
  gateway:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  auth_gateway_data:
  engram_cloud_db_data:
