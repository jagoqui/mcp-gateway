name: mcp-gateway

# caddy, auth-gateway, the three pilot MCP services (PR1/PR2), plus
# engram-cloud, engram-cloud-db, and engram-monitor (PR3 — see
# openspec/changes/gateway-foundation/tasks.md, Phase 3).

x-mcp-image: &mcp-image
  build:
    context: .
    dockerfile: Dockerfile
    args:
      ENGRAM_VERSION: ${ENGRAM_VERSION:-}
  restart: unless-stopped
  networks:
    - gateway

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-jagoqui.tech}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./services/engram-hub:/srv/hub:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - gateway
    # engram-monitor runs with network_mode: host (see below), not the
    # bridge `gateway` network, so Caddy reaches it via the host's own
    # loopback-published port through this Docker-managed hostname instead
    # of a service name.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - auth-gateway
      - mcp-context7
      - mcp-atlassian
      - mcp-engram-tool
      - engram-cloud

  auth-gateway:
    build:
      context: ./services/auth-gateway
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-jagoqui.tech}
      ATLASSIAN_ENC_KEY: ${ATLASSIAN_ENC_KEY}
      AUTH_GATEWAY_SESSION_SECRET: ${AUTH_GATEWAY_SESSION_SECRET}
    # ENGRAM_CLOUD_TOKEN deliberately comes via env_file, not `${ENGRAM_CLOUD_TOKEN}`
    # substitution from this project's own .env: the engram-cloud instance actually
    # live behind engram-cloud.{$DOMAIN} (see Caddyfile) runs from a SEPARATE compose
    # project at ~/.engram, with its own .env and its own token — not the one below in
    # THIS file's (unused) `engram-cloud` service. Pointing straight at that file keeps
    # /engram-verify's comparison correct even if that token ever rotates, with no
    # manual copy to keep in sync (and no need to touch this repo's own .env).
    env_file:
      - /home/jaidiver/.engram/.env
    volumes:
      - auth_gateway_data:/data
    networks:
      - gateway
    expose:
      - "3000"

  mcp-context7:
    <<: *mcp-image
    command:
      [
        "supergateway",
        "--stdio", "context7-mcp",
        "--outputTransport", "streamableHttp",
        "--port", "9000",
        "--host", "0.0.0.0",
        # Caddy's `handle /mcp/context7*` forwards the full incoming path
        # (no strip), so this backend must serve exactly that path, not
        # its /mcp default — same reasoning for mcp-atlassian's --path and
        # mcp-engram-tool's --streamableHttpPath below.
        "--streamableHttpPath", "/mcp/context7"
      ]
    environment:
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY}
    expose:
      - "9000"

  mcp-atlassian:
    <<: *mcp-image
    command:
      [
        "mcp-atlassian",
        "--transport", "streamable-http",
        "--port", "9000",
        "--host", "0.0.0.0",
        "--path", "/mcp/atlassian"
      ]
    environment:
      ATLASSIAN_URL: ${ATLASSIAN_URL}
      ATLASSIAN_OAUTH_ENABLE: "true"
      # Explicit: mcp-atlassian's own default toolset scope changed in a
      # recent release, so an unset TOOLSETS now warns and depends on
      # whichever default that release ships. Pin to "all" to keep every
      # Jira/Confluence tool available regardless of upstream defaults.
      TOOLSETS: "all"
    expose:
      - "9000"

  mcp-engram-tool:
    <<: *mcp-image
    command:
      [
        "supergateway",
        "--stdio", "engram mcp",
        "--outputTransport", "streamableHttp",
        "--port", "9000",
        "--host", "0.0.0.0",
        "--streamableHttpPath", "/mcp/engram"
      ]
    environment:
      ENGRAM_API_KEY: ${ENGRAM_API_KEY}
    expose:
      - "9000"

  engram-cloud-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ENGRAM_CLOUD_DB_USER}
      POSTGRES_PASSWORD: ${ENGRAM_CLOUD_DB_PASSWORD}
      POSTGRES_DB: ${ENGRAM_CLOUD_DB_NAME}
    volumes:
      - engram_cloud_db_data:/var/lib/postgresql/data
    networks:
      - gateway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ENGRAM_CLOUD_DB_USER} -d ${ENGRAM_CLOUD_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs `engram cloud serve` (Postgres-backed team sync, its own built-in
  # dashboard at /dashboard/*) — a DIFFERENT surface from the plain
  # `engram serve` API engram-monitor (below) is wired to instead. Not
  # routed through Caddy yet; runs internally for future team-sync use.
  # NEVER set ENGRAM_CLOUD_INSECURE_NO_AUTH here (local-dev-only, disables
  # auth entirely) — not even as a commented example.
  engram-cloud:
    image: ghcr.io/gentleman-programming/engram:latest
    restart: unless-stopped
    environment:
      ENGRAM_DATABASE_URL: postgres://${ENGRAM_CLOUD_DB_USER}:${ENGRAM_CLOUD_DB_PASSWORD}@engram-cloud-db:5432/${ENGRAM_CLOUD_DB_NAME}
      ENGRAM_CLOUD_TOKEN: ${ENGRAM_CLOUD_TOKEN}
      ENGRAM_CLOUD_ADMIN: ${ENGRAM_CLOUD_ADMIN}
      ENGRAM_JWT_SECRET: ${ENGRAM_JWT_SECRET}
      ENGRAM_CLOUD_ALLOWED_PROJECTS: ${ENGRAM_CLOUD_ALLOWED_PROJECTS}
      ENGRAM_CLOUD_HOST: 0.0.0.0
      ENGRAM_PORT: "18080"
    depends_on:
      engram-cloud-db:
        condition: service_healthy
    networks:
      - gateway
    expose:
      - "18080"

  # Deliberately NOT routed through Caddy or published publicly — see
  # Caddyfile's comment and README.md's "engram-monitor backend" section
  # (its client sends no auth credentials, so it can't sit behind
  # forward_auth without breaking, and the underlying engram serve API has
  # no auth of its own to expose publicly instead). Reach it via a single
  # SSH tunnel of port 7438; nginx.conf proxies /api/* internally to the
  # host's engram serve, keeping the browser same-origin (engram serve
  # sends no CORS headers, so a cross-origin baseURL gets its responses
  # blocked by the browser regardless of tunnel connectivity).
  #
  # network_mode: host, not the gateway bridge network: the host's engram
  # serve binds 127.0.0.1 only (not 0.0.0.0), so no bridge-networked
  # container — not even via host.docker.internal — can reach it. Sharing
  # the host's own network namespace is the only way in. This also means
  # no `ports:`/`networks:`/`expose:` here — nginx.conf listens directly
  # on the host's port 7438 (chosen to stay clear of Caddy's 80/443).
  engram-monitor:
    build:
      context: ./services/engram-monitor
      args:
        VITE_ENGRAM_URL: ${VITE_ENGRAM_URL:-/api}
    restart: unless-stopped
    network_mode: host

networks:
  gateway:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  auth_gateway_data:
  engram_cloud_db_data:
